<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Task Manager</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><div><p class="eyebrow">STUDENT PRODUCTIVITY</p><h1>Student Task Manager</h1><p class="subtitle">Organize assignments, deadlines and study goals in one place.</p></div><div class="stats"><div><strong id="total">0</strong><span>Total</span></div><div><strong id="completed">0</strong><span>Done</span></div><div><strong id="pending">0</strong><span>Pending</span></div></div></header><section class="panel"><form id="taskForm"><input id="taskInput" placeholder="What do you need to do?" required maxlength="100"><input id="dueDate" type="date"><select id="priority"><option value="Low">Low priority</option><option value="Medium" selected>Medium priority</option><option value="High">High priority</option></select><button>+ Add Task</button></form></section><section class="toolbar"><input id="search" type="search" placeholder="Search tasks..."><select id="filter"><option value="all">All tasks</option><option value="pending">Pending</option><option value="completed">Completed</option><option value="high">High priority</option></select></section><section id="taskList" class="task-list"></section><p id="empty" class="empty">No tasks yet. Add your first task above.</p></main><script src="script.js"></script></body></html>
